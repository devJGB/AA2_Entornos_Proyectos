<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tareas</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <!-- Volver a proyectos -->
    <a class="back-link" href="./index.html">Volver a Proyectos</a>

    <!-- Título dinámico -->
    <h1 id="tasks-title">Tareas del Proyecto</h1>

    <!-- Formulario tareas -->
    <form id="task-form">
        <input type="hidden" id="task-id" />
        <input type="text" id="task-title" placeholder="Título" required />
        <input type="text" id="task-description" placeholder="Descripción" />
        <label class="task-check">
            <input type="checkbox" id="task-done" />
            Realizada
        </label>
        <button type="submit">Guardar</button>
        <button type="button" id="cancel-task-edit">Cancelar</button>
    </form>

     <!-- Mensajes de validación -->
    <div id="task-errors" class="form-errors"></div>


    <!-- Listado de tareas -->
    <div id="tasks"></div>

    <script src="./tasks.js" type="module"></script>
</body>
</html>
